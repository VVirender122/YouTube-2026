<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Password Reset</title>
    <link rel="stylesheet" href="css/theme.css">
</head>

<body class="auth-page">

<div class="auth-card">

    <h2 id="title">Reset Password</h2>

    <p id="message" aria-live="polite"></p>

    <!-- Request reset link -->
    <form id="requestForm"
          action="PasswordResetRequestServlet"
          method="post">

        <div class="form-group">
            <label for="resetEmail">Account email</label>

            <input
                id="resetEmail"
                type="email"
                name="userEmail"
                placeholder="you@example.com"
                autocomplete="email"
                required>
        </div>

        <button type="submit">
            Send reset link
        </button>
    </form>

    <!-- Set new password -->
    <form id="resetForm"
          action="PasswordResetServlet"
          method="post"
          hidden>

        <input
            type="hidden"
            id="token"
            name="token">

        <div class="form-group">
            <label for="password">
                New password
            </label>

            <input
                id="password"
                type="password"
                name="password"
                minlength="8"
                autocomplete="new-password"
                required>
        </div>

        <div class="form-group">
            <label for="confirmPassword">
                Confirm password
            </label>

            <input
                id="confirmPassword"
                type="password"
                name="confirmPassword"
                minlength="8"
                autocomplete="new-password"
                required>
        </div>

        <button type="submit">
            Update password
        </button>
    </form>

    <p>
        <a href="LoginPage.html">Back to login</a>
    </p>

</div>

<script>
const params = new URLSearchParams(window.location.search);

const requestForm = document.getElementById("requestForm");
const resetForm = document.getElementById("resetForm");
const tokenInput = document.getElementById("token");
const title = document.getElementById("title");
const message = document.getElementById("message");

const token = params.get("token");

const messages = {
    sent:
        "If that account exists, a password reset link has been sent.",

    "invalid-email":
        "Please enter a valid email address.",

    mail:
        "The reset email could not be sent. Check mail configuration.",

    account:
        "The password reset request could not be processed.",

    validation:
        "Use a valid reset link and matching passwords of at least 8 characters.",

    expired:
        "This reset link is invalid, expired, or has already been used.",

    reset:
        "Your password has been changed. You can now log in."
};

if (token) {
    requestForm.hidden = true;
    resetForm.hidden = false;

    title.textContent = "Choose New Password";
    tokenInput.value = token;

    message.textContent =
        "Enter a new password for your account.";
} else {
    requestForm.hidden = false;
    resetForm.hidden = true;

    if (params.has("sent")) {
        message.textContent = messages.sent;
    } else if (params.has("error")) {
        const error = params.get("error");
        message.textContent =
            messages[error] || "Something went wrong.";
    }
}
</script>

</body>
</html>
