<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Password Reset</title>
    <link rel="stylesheet" href="css/theme.css">
</head>
<body class="auth-page">

<div class="auth-card">
    <h2>Reset Password</h2>

    <p id="message" aria-live="polite"></p>

    <form action="PasswordResetRequestServlet" method="post">
        <div class="form-group">
            <label for="resetEmail">Account email</label>
            <input id="resetEmail" type="email" name="userEmail"
                   placeholder="you@example.com" required>
        </div>
        <button type="submit">Send reset code</button>
    </form>

    <hr>

    <form action="PasswordResetServlet" method="post">
        <div class="form-group">
            <label for="confirmEmail">Account email</label>
            <input id="confirmEmail" type="email" name="userEmail"
                   placeholder="you@example.com" required>
        </div>

        <div class="form-group">
            <label for="otp">Reset code</label>
            <input id="otp" name="otp" inputmode="numeric"
                   pattern="[0-9]{6}" maxlength="6" placeholder="6-digit code" required>
        </div>

        <div class="form-group">
            <label for="password">New password</label>
            <input id="password" type="password" name="password"
                   minlength="8" required>
        </div>

        <div class="form-group">
            <label for="confirmPassword">Confirm password</label>
            <input id="confirmPassword" type="password" name="confirmPassword"
                   minlength="8" required>
        </div>

        <button type="submit">Update password</button>
    </form>

    <p><a href="LoginPage.html">Back to login</a></p>
</div>

<script>
const params = new URLSearchParams(location.search);
const message = document.getElementById("message");
const text = {
    "sent": "If that account exists, a reset code has been sent.",
    "invalid-email": "Please enter a valid email address.",
    "mail": "The reset email could not be sent. Check mail configuration.",
    "validation": "Use a valid email and matching passwords of at least 8 characters.",
    "expired": "Your reset session expired. Request a new code.",
    "otp": "The reset code is invalid or expired.",
    "account": "The password could not be updated."
};
if (params.has("sent")) message.textContent = text.sent;
else if (params.has("error")) message.textContent = text[params.get("error")] || "Something went wrong.";
</script>

</body>
</html>
