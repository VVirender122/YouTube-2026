<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Verify OTP</title>
    <link rel="stylesheet" href="css/theme.css">
</head>
<body class="auth-page">

<form class="auth-card" action="OTPValidationServlet" method="post">
    <h2>Verify Email</h2>
    <p id="message">Enter the 6-digit code sent to your email.</p>

    <div class="form-group">
        <label for="enteredOTP">Verification code</label>
        <input id="enteredOTP" name="enteredOTP" inputmode="numeric"
               pattern="[0-9]{6}" maxlength="6"
               placeholder="6-digit OTP" autocomplete="one-time-code" required>
    </div>

    <button type="submit">Verify</button>
    <p><a href="RegisterPage.html">Start over</a></p>
</form>

<script>
const params = new URLSearchParams(location.search);
if (params.has("error")) {
    document.getElementById("message").textContent =
        "The code is invalid or expired. Please start registration again.";
}
</script>
</body>
</html>
