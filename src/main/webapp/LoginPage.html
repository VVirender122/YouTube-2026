<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Login</title>
    <link rel="stylesheet" href="css/theme.css">
</head>
<body class="auth-page">

<form class="auth-card" action="LoginServlet" method="post">
    <h2>Login</h2>
    <p id="message" aria-live="polite"></p>

    <div class="form-group">
        <label for="userEmail">Email</label>
        <input id="userEmail" type="email" name="userEmail"
               placeholder="Enter email" autocomplete="email" required>
    </div>

    <div class="form-group">
        <label for="userPass">Password</label>
        <input id="userPass" type="password" name="userPass"
               placeholder="Enter password" autocomplete="current-password" required>
    </div>

    <button type="submit">Login</button>

    <p>
        Don't have an account? <a href="RegisterPage.html">Register</a><br>
        Forgot Password? <a href="PasswordResetPage.html">Reset Password</a>
    </p>
</form>

<script>
const params = new URLSearchParams(location.search);
const message = document.getElementById("message");
if (params.has("error")) message.textContent = "Invalid email or password.";
if (params.has("registered")) message.textContent = "Account created. You can now log in.";
if (params.has("reset")) message.textContent = "Password updated. Please log in.";
</script>
</body>
</html>
